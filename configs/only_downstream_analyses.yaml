  norm_per_channel_file: "/home/nbahou/myimaging/scDINO/output/test_scDINO_20x_ds2_t5_2cat_128/mean_and_std_of_dataset.txt"
  #norm_per_channel: [(x,x,x,x,x),(x,x,x,x,x)] #only used if parse_mean_std_from_file is False
  use_cuda: True
  num_gpus: 1
  batch_size_per_gpu: 256
  num_workers: 8
  pretrained_weights: "/home/nbahou/myimaging/scDINO/output/test_scDINO_20x_ds2_t5_2cat_128/scDINO_ViTs/300ep_5ch_resize128_25-5-5-1_vitSmall16_lr0003_channel_0_1_2_3_4"
